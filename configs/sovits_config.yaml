# GPT-SoVITS TTS Configuration

api:
  base_url: "http://localhost:9880"
  endpoint: "/tts"
  timeout: 60

reference:
  audio_path: "./assets/voices/megumi_clean.wav"
  audio_text: "For the cost of a meal and basic necessities, you can have the power of an archwizard. Just give me a permanent spot in your party and I'm all yours"
  # Language: en, ja, zh, etc.
  language: "en"

inference:
  speed_factor: 1.2
  top_k: 5
  top_p: 1.0
  temperature: 1.0

output:
  sampling_rate: 44100
  # true = play audio, false = only generate
  auto_play: true
  # true = async playback (non-blocking), false = blocks chat
  async_playback: true