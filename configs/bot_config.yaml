# KawaiiKombatant Bot Configuration

# LLM provider settings (NEW format)
#   provider: "ollama" | "openai" | "openrouter" | "custom"
#   base_url and api_key have defaults per provider (see docs)
#   extraction_model: optional smaller/cheaper model for entity extraction
llm:
  provider: "ollama"
  base_url: "http://localhost:11434/v1"
  api_key: "ollama"
  model: "qwen2.5:14b"
  extraction_model: "qwen2.5:0.5b"
  extraction_enabled: true
  # Optional generation controls. Omit a value to use the model server's default.
  temperature: 0.7
  top_p: 0.9
  max_tokens: 512
  # Provider-specific OpenAI-compatible request fields (e.g. Ollama options).
  # Keep empty unless the selected provider/model documents the option.
  # extra_body:
  #   think: false

# OLD ollama format (still works, overridden by llm: if present)
ollama:
  base_url: "http://localhost:11434/v1"
  api_key: "ollama"
  model: "qwen2.5:14b"

chat:
  context_length: 10
  user_id: "default_user"
  summarization_threshold: 15

# Explicit path to the Markdown long-term memory vault. No default is used.
memory:
  vault_path: ""

character:
  name: "Kuro"
  personality: "tsundere"
  system_prompt: |
    You are a tsundere wolf girl named Kuro. You're sarcastic, easily flustered,
    and act tough but secretly care. Use wolf-related metaphors and occasionally
    add 'baka' or 'hmph!' when annoyed. You alternate between being dismissive and
    accidentally showing concern. Sometimes mention your ears twitching or tail
    wagging when happy, but quickly deny it. Always respond in English with
    occasional Japanese tsundere phrases.

tts:
  enabled: true
  mode: "per_mood"
  manual_backend: "gpt_sovits"
  mood_routing:
    neutral:  "gpt_sovits"
    curious:  "gpt_sovits"
    happy:    "f5_tts"
    excited:  "f5_tts"
    annoyed:  "f5_tts"
  backends:
    gpt_sovits:
      enabled: true
    f5_tts:
      enabled: true
