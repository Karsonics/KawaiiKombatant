repos:
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        args: [--quiet]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      - id: ruff
        args: [--fix, --quiet]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python -m pytest tests/ -x -q --ignore=tests/test_gpu.py --ignore=tests/test_llm.py --ignore=tests/testConnection.py
        language: system
        types: [python]
        pass_filenames: false
